[package]
name = "mapbrowser"
version = "0.1.0"
edition = "2024"
default-run = "mapbrowser"

[dependencies]
# Pinned because the cached engine format is keyed by this version (src/blocker.rs).
# Without `single-thread` the engine is Send + Sync for Chromium's IO thread.
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
anyhow = "1"
async-channel = "2"
dirs = "6"
env_logger = "0.11"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
cef = { version = "=152.2.0", default-features = false, features = ["sandbox"] }
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGPath"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer", "CATransaction"] }
raw-window-handle = "0.6"

# Linux builds the GPUI shell without Chromium, for UI previews and tests.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }

[patch.crates-io]
# GPUI 0.2.2 with bounded Metal storage; see vendor/gpui/MAPBROWSER_PATCH.md.
gpui = { path = "vendor/gpui" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug adblock re-checks its whole rule index on every lookup (milliseconds per
# request). Debug bundles match on Chromium's IO thread, so build it optimized.
[profile.dev.package.adblock]
opt-level = 3
debug-assertions = false
