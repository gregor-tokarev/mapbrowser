[package]
name = "mapbrowser"
version = "0.1.0"
edition = "2024"
default-run = "mapbrowser"

[dependencies]
anyhow = "1"
async-channel = "2"
block2 = "0.6"
cef = { version = "=152.2.0", default-features = false, features = ["sandbox"] }
dirs = "6"
env_logger = "0.11"
dispatch2 = "0.3"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[patch.crates-io]
# GPUI 0.2.2 with bounded Metal storage; see vendor/gpui/MAPBROWSER_PATCH.md.
gpui = { path = "vendor/gpui" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
