<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Map Browser's app icon: a folded map and a pin on the default space's
       lavender gradient. Rendered to AppIcon.icns by scripts/make_icon.py. -->
  <defs>
    <linearGradient id="space" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#cbcefa"/>
      <stop offset="0.75" stop-color="#f2d6e3"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7378fb"/>
      <stop offset="1" stop-color="#4a50e3"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e2160" flood-opacity="0.22"/>
    </filter>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Apple's 824 pt icon grid on a 1024 pt canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#space)" filter="url(#body)"/>
  <!-- A map folded in three. -->
  <g filter="url(#lift)">
    <path d="M214 356 L408 300 L616 356 L810 300 L810 736 L616 792 L408 736 L214 792 Z" fill="#ffffff"/>
    <path d="M408 300 L616 356 L616 792 L408 736 Z" fill="#e6e8fd"/>
  </g>
  <!-- The way there. -->
  <path d="M286 690 C356 610 418 690 486 616 C548 548 590 600 624 560" fill="none" stroke="#9ea3f8" stroke-width="20" stroke-linecap="round" stroke-dasharray="1 40"/>
  <!-- The pin. -->
  <g filter="url(#lift)">
    <path d="M664 668 C590 548 526 466 526 392 A138 138 0 0 1 802 392 C802 466 738 548 664 668 Z" fill="url(#pin)"/>
    <circle cx="664" cy="392" r="54" fill="#ffffff"/>
  </g>
</svg>
